<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Car Game Ultra</title>

<style>
body { margin:0; overflow:hidden; background:#111; font-family:sans-serif; }

.ui {
    position:absolute;
    top:10px;
    width:100%;
    text-align:center;
    color:white;
}

button {
    border:2px solid white;
    background:transparent;
    color:white;
    padding:10px 20px;
    border-radius:10px;
    margin-top:10px;
    transition:.2s;
}
button:active { transform:scale(0.9); background:rgba(255,255,255,0.2); }

.controls {
    position:absolute;
    bottom:20px;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:0 30px;
}
.ctrlBtn {
    width:70px; height:70px;
    font-size:24px;
}
</style>
</head>

<body>

<div class="ui">
    <div id="status">Loading Car...</div>
    <button onclick="restartGame()">Restart</button>
</div>

<div class="controls">
    <button class="ctrlBtn" id="leftBtn">⬅️</button>
    <button class="ctrlBtn" id="rightBtn">➡️</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134/examples/js/loaders/GLTFLoader.js"></script>

<script>
let scene, camera, renderer;
let car;
let traffic = [];
let moveLeft=false, moveRight=false;
let gameOver=false;

init();

function init(){
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
    camera.position.set(0,5,10);

    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth,innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff,1);
    light.position.set(0,10,10);
    scene.add(light);

    createRoad();
    createEnvironment();
    createTraffic();
    loadCar();

    // controls
    document.addEventListener("keydown",e=>{
        if(e.key==="ArrowLeft") moveLeft=true;
        if(e.key==="ArrowRight") moveRight=true;
    });
    document.addEventListener("keyup",e=>{
        if(e.key==="ArrowLeft") moveLeft=false;
        if(e.key==="ArrowRight") moveRight=false;
    });

    leftBtn.ontouchstart=()=>moveLeft=true;
    leftBtn.ontouchend=()=>moveLeft=false;
    rightBtn.ontouchstart=()=>moveRight=true;
    rightBtn.ontouchend=()=>moveRight=false;

    window.onresize=()=>{
        camera.aspect=innerWidth/innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth,innerHeight);
    };
}

// LOAD REAL 3D CAR
function loadCar(){
    const loader = new THREE.GLTFLoader();

    loader.load(
        "https://threejs.org/examples/models/gltf/Flamingo.glb", // demo model (replace with car model)
        (gltf)=>{
            car = gltf.scene;
            car.scale.set(0.01,0.01,0.01);
            car.position.y=0.5;
            scene.add(car);
            document.getElementById("status").innerText="Running...";
            animate();
        }
    );
}

// ROAD + WHITE LINES
function createRoad(){
    const road = new THREE.Mesh(
        new THREE.PlaneGeometry(10,300),
        new THREE.MeshPhongMaterial({color:0x222222})
    );
    road.rotation.x=-Math.PI/2;
    scene.add(road);

    for(let i=0;i<60;i++){
        const line = new THREE.Mesh(
            new THREE.BoxGeometry(0.2,0.01,2),
            new THREE.MeshBasicMaterial({color:0xffffff})
        );
        line.position.set(0,0.02,i*5-150);
        scene.add(line);
    }
}

// TRAFFIC
function createTraffic(){
    for(let i=0;i<6;i++){
        const t = new THREE.Mesh(
            new THREE.BoxGeometry(1.5,0.5,3),
            new THREE.MeshPhongMaterial({color:Math.random()*0xffffff})
        );
        resetTraffic(t);
        traffic.push(t);
        scene.add(t);
    }
}

function resetTraffic(t){
    t.position.set(Math.random()*8-4,0.5,-Math.random()*200);
}

// ENVIRONMENT
function createEnvironment(){
    for(let i=0;i<40;i++){

        // trees
        const tree = new THREE.Mesh(
            new THREE.ConeGeometry(1,3,8),
            new THREE.MeshPhongMaterial({color:0x228B22})
        );
        tree.position.set(7,1.5,i*10-150);
        scene.add(tree);

        // houses
        const house = new THREE.Mesh(
            new THREE.BoxGeometry(2,2,2),
            new THREE.MeshPhongMaterial({color:0xffccaa})
        );
        house.position.set(-7,1,i*10-150);
        scene.add(house);
    }
}

// GAME LOOP
function animate(){
    requestAnimationFrame(animate);

    if(!gameOver && car){

        scene.children.forEach(obj=>{
            if(obj.position) obj.position.z += 0.5;
        });

        if(moveLeft) car.position.x -= 0.15;
        if(moveRight) car.position.x += 0.15;
        car.position.x = Math.max(-4,Math.min(4,car.position.x));

        traffic.forEach(t=>{
            t.position.z += 0.7;

            if(t.position.z > 10) resetTraffic(t);

            if(Math.abs(t.position.z - car.position.z) < 2 &&
               Math.abs(t.position.x - car.position.x) < 1.5){
                gameOver=true;
                status.innerText="💥 Game Over";
            }
        });

        camera.position.x = car.position.x;
    }

    renderer.render(scene,camera);
}

// RESTART
function restartGame(){
    gameOver=false;
    if(car) car.position.x=0;
    traffic.forEach(resetTraffic);
    status.innerText="Running...";
}
</script>

</body>
</html>y
